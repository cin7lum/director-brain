name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest   # 与开发环境同系（路径/编码行为一致）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Run tests
        env:
          # CI 无密钥/无 GPU/无 ollama——环境条件跳过按设计生效
          RUN_REAL_ASR: ""
        run: python -m pytest tests -q

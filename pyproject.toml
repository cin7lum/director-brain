[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "director-brain"
version = "0.1.0"
description = "Director Brain: 将创作意图、素材事实与质量反馈转化为可解释、可追溯、可修订的导演决策"
requires-python = ">=3.11"
# 运行时依赖 = 主链 import 即需（observation_service.pipeline 第一行就 import cv2/numpy）
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    # api/（REST 8 端点，被集成测试覆盖）与 beat_grid（D5）为核心依赖——
    # 原计划"删除零实现 http extra"顺带完成：api 已实现，extra 名不副实
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "huey>=3.4,<4",  # durable local SQLite queue for long project analyses
    "librosa>=0.10",  # D5 节拍网格（ISC；采用级准入，见计划附录 A）
]

[project.optional-dependencies]
# ASR（faster-whisper 拖带 ctranslate2/CUDA 二进制，重依赖，按需安装）
asr = [
    "faster-whisper>=1.0",
]
dev = [
    "httpx2>=0.1",  # starlette TestClient（新版必需）
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
include = ["director_brain*", "observation_service*", "arsenal*", "davinci_execution*", "fql*", "gen1_adapter*", "storage*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
